<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- 引入純 JS 輕量滾輪日期套件 -->
  <script src="https://cdn.jsdelivr.net/npm/rolldate@3.1.3/dist/rolldate.min.js"></script>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>紫微斗數排盤與 AI 智能解析系統</title>
  <style>
    :root {
      --bg-color: #f7f3ee;          /* 溫潤燕麥色背景 */
      --card-bg: #ffffff;           /* 純白象牙卡片背景 */
      --border-color: #d6ccbe;      /* 柔和咖啡灰邊框 */
      --accent-brown: #4a3b32;      /* 沉穩可可棕 */
      --accent-terracotta: #b86b4f; /* 暖橘陶瓦色 */
      --accent-green: #3b7a57;      /* 柔和墨綠 */
      --accent-blue: #3a76a8;       /* 沉穩藍 */
      --accent-purple: #7b52ab;     /* 優雅紫 */
      --text-main: #3a3532;         /* 深可可主字體 */
      --text-muted: #8c8278;        /* 柔和次要字體 */
      --highlight-sanfang: rgba(184, 107, 79, 0.12);
      --highlight-duigong: rgba(58, 118, 168, 0.12);
      --highlight-active: rgba(123, 82, 171, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 12px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 1.7rem;
      color: var(--accent-brown);
      letter-spacing: 2px;
      margin-bottom: 4px;
      font-weight: 700;
    }

    /* 頂部表單控制卡片 */
    .control-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      align-items: flex-end;
      box-shadow: 0 2px 8px rgba(74, 59, 50, 0.05);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0; /* 防止 Grid 欄位被內部元件撐爆超出容器 */
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    
    /* 1. 【一鍵排盤 / 其他按鈕】完全保持原樣，不設定固定高度 */
    button {
      background: #fcfbfa;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.92rem;
      outline: none;
      width: 100%;
      box-sizing: border-box;
    }

    .btn-primary {
      background: var(--accent-brown);
      border-color: var(--accent-brown);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    /* 2. 【僅針對所有輸入框與下拉選單】鎖定 42px 統一高度 */
    input, select {
      background: #fcfbfa;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      font-size: 0.92rem;
      outline: none;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      height: 42px;
      padding: 0 10px;
      line-height: normal;
    }

    /* 3. 修正 iOS Safari 下拉選單垂直對齊 */
    select {
      height: 42px;
      line-height: 42px;
      -webkit-appearance: menulist;
    }

    /* 4. 修正 iOS Safari 文字框與日期框高度與文字置中 */
    input[type="date"],
    input[type="text"],
    input[type="email"],
    input[type="number"] {
      height: 42px;
      line-height: 42px;
      padding: 0 10px;
      -webkit-appearance: none;
    }

    input[type="date"]::-webkit-date-and-time-value {
      height: 42px;
      line-height: 42px;
      margin: 0;
      padding: 0;
    }

    input:focus, select:focus {
      border-color: var(--accent-brown);
      background: #fff;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: #eae3d9;
      border-color: var(--border-color);
      color: var(--accent-brown);
      cursor: pointer;
      font-weight: 600;
    }

    .btn-secondary:hover {
      background: #dfd7cc;
    }

    .btn-ai {
      background: linear-gradient(135deg, #7b52ab 0%, #4a3b32 100%);
      border: none;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-ai:hover {
      opacity: 0.9;
    }

    .btn-ai:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 縮放外框 */
    .chart-viewport-wrapper {
      width: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin-bottom: 20px;
      position: relative;
      scroll-margin-top: 12px;
    }

    .chart-scaler {
      transform-origin: top center;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }

    /* 4x4 天盤標準基底 740px x 740px */
    .chart-grid {
      width: 740px;
      height: 740px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 6px;
      background: #eae3d9;
      padding: 8px;
      border: 2px solid var(--accent-brown);
      border-radius: 12px;
      box-sizing: border-box;
      position: relative;
      box-shadow: 0 6px 20px rgba(74, 59, 50, 0.1);
    }

    /* 十二宮位卡片 */
    .palace-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    .palace-card:hover {
      border-color: var(--accent-terracotta);
      transform: translateY(-1px);
    }

    .palace-card.active-selected {
      border-color: var(--accent-purple) !important;
      background: var(--highlight-active) !important;
      box-shadow: 0 0 12px rgba(123, 82, 171, 0.25);
    }

    .palace-card.highlight-opposite {
      background: var(--highlight-duigong);
      border-color: var(--accent-blue);
    }

    .palace-card.highlight-trine {
      background: var(--highlight-sanfang);
      border-color: var(--accent-terracotta);
    }

    .stars-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      min-height: 54px;
      align-content: flex-start;
    }

    .star-badge {
      font-size: 1.02rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px 5px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .star-major {
      color: #8c5a23;
      background: rgba(140, 90, 35, 0.1);
    }

    .star-minor-good {
      color: var(--accent-green);
      background: rgba(59, 122, 87, 0.1);
      font-size: 0.95rem;
    }

    .star-minor-bad {
      color: #b83b3b;
      background: rgba(184, 59, 59, 0.1);
      font-size: 0.95rem;
    }

    .star-brightness {
      font-size: 0.8rem;
      opacity: 0.85;
      font-weight: 500;
    }

    .sihua-tag {
      font-size: 0.8rem;
      padding: 0 4px;
      border-radius: 3px;
      margin-left: 2px;
      font-weight: 800;
    }
    .sihua-lu { background: #3b7a57; color: #fff; }
    .sihua-quan { background: #b83b3b; color: #fff; }
    .sihua-ke { background: #3a76a8; color: #fff; }
    .sihua-ji { background: #7b52ab; color: #fff; }

    .palace-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 4px;
      border-top: 1px dashed var(--border-color);
      padding-top: 5px;
    }

    .limits-info {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.25;
      font-weight: 500;
      flex: 1;
      margin-right: 6px;
    }

    .palace-name-group {
      text-align: right;
      flex-shrink: 0;
    }

    .palace-name {
      font-size: 1.12rem;
      font-weight: bold;
      color: var(--accent-brown);
    }

    .palace-body-mark {
      font-size: 0.85rem;
      color: #b83b3b;
      margin-left: 2px;
    }

    .palace-stem-branch {
      font-size: 0.95rem;
      color: var(--accent-terracotta);
      font-weight: 600;
    }

    /* 中央中堂 2x2 空間 */
    .center-hall {
      grid-column: 2 / 4;
      grid-row: 2 / 4;
      background: var(--card-bg);
      border: 2px solid var(--accent-brown);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 12px rgba(74, 59, 50, 0.08);
    }

    .bazi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center;
      background: #f7f3ee;
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 6px;
      border: 1px solid var(--border-color);
    }

    .bazi-item .pillar-title {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .bazi-item .pillar-val {
      font-size: 1.08rem;
      font-weight: bold;
      color: var(--accent-brown);
    }

    .meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 6px;
    }

    .meta-chip {
      background: #f7f3ee;
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 0.82rem;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .sanfang-inspector {
      background: #f7f3ee;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      font-size: 0.84rem;
      color: var(--text-muted);
      min-height: 54px;
    }

    .sanfang-inspector span {
      color: var(--accent-brown);
      font-weight: 600;
    }

    /* AI 解析面板 */
    .ai-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(74, 59, 50, 0.06);
	  scroll-margin-top: 12px; /* 捲動對齊時保留 12px 頂部間距 */
    }

    .ai-header {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      gap: 8px;
    }

    .ai-header-main {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .ai-header h2 {
      font-size: 1.2rem;
      color: var(--accent-brown);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .btn-copy-report {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      width: auto;
      margin-left: auto;
      flex-shrink: 0;
    }

    /* 動態宮位檢視標籤樣式（置於最上方並置中對齊） */
    .palace-view-badge {
      font-size: 0.95rem;
      color: var(--accent-terracotta);
      font-weight: 700;
      background: rgba(184, 107, 79, 0.1);
      padding: 3px 10px;
      border-radius: 6px;
      white-space: nowrap;
      align-self: center;
      margin: 0 auto;
    }

    .ai-output-box {
      background: #fcfbfa;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 18px;
      min-height: 160px;
      font-size: 0.96rem;
      color: var(--text-main);
      position: relative;
    }

    .ai-output-box.loading {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Markdown 排版與階層優化 */
    .ai-markdown h3 {
      color: var(--accent-brown);
      margin: 20px 0 10px 0;
      font-size: 1.18rem;
      border-bottom: 1.5px solid var(--border-color);
      padding-bottom: 5px;
      font-weight: 700;
    }
    .ai-markdown h3:first-child { margin-top: 0; }
    
    /* 支援四級子標題 #### */
    .ai-markdown h4 {
      color: var(--accent-terracotta);
      font-size: 1.05rem;
      margin: 16px 0 8px 0;
      font-weight: 600;
    }

    .ai-markdown p { 
      margin-bottom: 10px; 
      line-height: 1.75; 
    }
    .ai-markdown strong { 
      color: var(--accent-terracotta); 
      font-weight: 600; 
    }
    
    /* 分隔線美化 */
    .ai-markdown hr.ai-divider {
      border: none;
      border-top: 1px dashed var(--border-color);
      margin: 18px 0;
    }

    /* 條列式清單與子項目對齊 */
    .ai-markdown ul, .ai-markdown ol { 
      margin: 8px 0 14px 22px; 
      padding: 0;
    }
    .ai-markdown li { 
      margin-bottom: 6px; 
      line-height: 1.7;
    }
    .ai-markdown li.ai-sub-item {
      margin-left: 18px;
      list-style-type: circle;
    }
    
    .ai-markdown blockquote {
      border-left: 4px solid var(--accent-blue);
      background: rgba(58, 118, 168, 0.06);
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
      color: var(--text-main);
      margin: 14px 0;
      font-size: 0.94rem;
      line-height: 1.6;
    }

    .cursor-blink {
      display: inline-block;
      width: 5px;
      height: 14px;
      background: var(--accent-brown);
      margin-left: 4px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    
    /* 排盤完成提醒橫幅 */
    .chart-ready-notice {
      background: linear-gradient(135deg, #fffaf5 0%, #fdf4ed 100%);
      border: 1.5px solid var(--accent-terracotta);
      border-radius: 10px;
      padding: 12px 18px;
      margin-bottom: 16px;
      text-align: center;
      color: var(--accent-brown);
      font-size: 0.96rem;
      line-height: 1.6;
      box-shadow: 0 4px 12px rgba(184, 107, 79, 0.12);
      animation: noticeFadeIn 0.35s ease-out;
    }

    .chart-ready-notice .highlight-name {
      color: var(--accent-terracotta);
      font-weight: 700;
      font-size: 1.05rem;
      padding: 0 2px;
    }

    @keyframes noticeFadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* 手機版右下角圓形奶茶色懸浮按鈕：回到命盤 */
    .floating-back-btn {
      display: none;
      position: fixed;
      right: 16px;
      bottom: 20px;
      width: 56px;
      height: 56px;
      padding: 0;
      z-index: 999;
      background: linear-gradient(135deg, #e8dacb 0%, #d8c3ae 100%);
      color: var(--accent-brown);
      border: 1.5px solid #c5b09a;
      border-radius: 50%;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 1px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(74, 59, 50, 0.18);
      cursor: pointer;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .floating-back-btn:hover,
    .floating-back-btn:active {
      filter: brightness(0.96);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(74, 59, 50, 0.25);
    }

    /* 複製成功提示 Toast */
    .copy-toast {
      position: fixed;
      bottom: 86px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(74, 59, 50, 0.95);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      white-space: nowrap;
    }

    .copy-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 手機與平板尺寸響應式調整 */
    @media (max-width: 768px) {
      .palace-view-badge {
        font-size: 0.88rem;
        padding: 3px 8px;
      }

      .ai-header h2 {
        font-size: 1.12rem;
      }

      .btn-copy-report {
        margin-left: auto;
        width: auto;
        padding: 7px 12px;
        font-size: 0.88rem;
      }

      .floating-back-btn {
        display: flex;
      }
    }

    /* 僅在手機直立螢幕（雙欄排版）時生效，不影響電腦版 */
    @media (max-width: 600px) {
      .control-panel .btn-primary {
        grid-column: 2;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>紫微斗數命盤解析</h1>
    <p style="color: var(--text-muted); font-size: 0.88rem;">質感美學排盤 ‧ 納音五行局 ‧ AI 智能深度解盤</p>
  </header>

  <!-- 參數配置列 -->
  <div class="control-panel">
  
    <div class="form-group">
      <label>暱稱</label>
      <input type="text" id="userName" placeholder="請輸入姓名或稱呼" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="userEmail" placeholder="example@gmail.com" />
    </div>
    
    <div class="form-group">
      <label>曆法輸入模式</label>
      <select id="calendarMode" onchange="toggleCalendarMode()">
        <option value="solar">西曆 (國曆)</option>
        <option value="lunar">農曆</option>
      </select>
    </div>

    <div class="form-group" id="solarDateGroup">
      <label>西曆出生年月日</label>
      <input type="text" id="solarDate" readonly placeholder="點擊選擇日期" style="cursor: pointer;" />
    </div>

    <div class="form-group" id="lunarYearGroup" style="display:none;">
      <label>農曆年 (西元)</label>
      <input type="number" id="lunarYear" min="1900" max="2050" />
    </div>

    <div class="form-group" id="lunarMonthGroup" style="display:none;">
      <label>農曆月</label>
      <select id="lunarMonth">
        <option value="1">正月 (1月)</option>
        <option value="2">二月 (2月)</option>
        <option value="3">三月 (3月)</option>
        <option value="4">四月 (4月)</option>
        <option value="5">五月 (5月)</option>
        <option value="6">六月 (6月)</option>
        <option value="7">七月 (7月)</option>
        <option value="8">八月 (8月)</option>
        <option value="9">九月 (9月)</option>
        <option value="10">十月 (10月)</option>
        <option value="11">十一月 (11月)</option>
        <option value="12">十二月 (12月)</option>
      </select>
    </div>

    <div class="form-group" id="lunarDayGroup" style="display:none;">
      <label>農曆出生日</label>
      <input type="number" id="lunarDay" min="1" max="30" />
    </div>

    <div class="form-group">
      <label>出生時辰 (地支)</label>
      <select id="hourBranch">
        <option value="0" selected>子時 (23:00 - 01:00)</option>
        <option value="1">丑時 (01:00 - 03:00)</option>
        <option value="2">寅時 (03:00 - 05:00)</option>
        <option value="3">卯時 (05:00 - 07:00)</option>
        <option value="4">辰時 (07:00 - 09:00)</option>
        <option value="5">巳時 (09:00 - 11:00)</option>
        <option value="6">午時 (11:00 - 13:00)</option>
        <option value="7">未時 (13:00 - 15:00)</option>
        <option value="8">申時 (15:00 - 17:00)</option>
        <option value="9">酉時 (17:00 - 19:00)</option>
        <option value="10">戌時 (19:00 - 21:00)</option>
        <option value="11">亥時 (21:00 - 23:00)</option>
      </select>
    </div>

    <div class="form-group">
      <label>性別</label>
      <select id="gender">
        <option value="M">男</option>
        <option value="F" selected>女</option>
      </select>
    </div>

    <button class="btn-primary" onclick="generateChart(true)">一鍵排盤</button>

function solarToLunar(sDate) {
  try {
    const dtf = new Intl.DateTimeFormat('zh-TW-u-ca-chinese', { year: 'numeric', month: 'numeric', day: 'numeric' });
    const parts = dtf.formatToParts(sDate);
    let y, m, d;
    for (const part of parts) {
      if (part.type === 'relatedYear') y = parseInt(part.value, 10);
      else if (part.type === 'year' && !y) {
        const parsed = parseInt(part.value, 10);
        if (!isNaN(parsed)) y = parsed;
      } else if (part.type === 'month') {
        let val = part.value;
        let num = parseInt(val.replace(/[^0-9]/g, ''), 10);
        if (isNaN(num)) {
          const cnNums = {'正':1,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'冬':11,'十一':11,'臘':12,'十二':12};
          for (let key in cnNums) { if (val.includes(key)) { num = cnNums[key]; break; } }
        }
        m = num || 1;
      } else if (part.type === 'day') {
        let val = part.value;
        let num = parseInt(val.replace(/[^0-9]/g, ''), 10);
        if (isNaN(num)) {
          const dayMap = {'初一':1,'初二':2,'初三':3,'初四':4,'初五':5,'初六':6,'初七':7,'初八':8,'初九':9,'初十':10,'十一':11,'十二':12,'十三':13,'十四':14,'十五':15,'十六':16,'十七':17,'十八':18,'十九':19,'二十':20,'廿一':21,'廿二':22,'廿三':23,'廿四':24,'廿五':25,'廿六':26,'廿七':27,'廿八':28,'廿九':29,'三十':30};
          for (let key in dayMap) { if (val.includes(key)) { num = dayMap[key]; break; } }
        }
        d = num || 1;
      }
    }
    if (y && m && d) return { year: y, month: m, day: d, isLeap: false };
  } catch (e) {}
  const y = sDate.getFullYear();
  const m = sDate.getMonth() + 1;
  const d = sDate.getDate();
  return { year: y, month: Math.max(1, m - 1), day: Math.min(30, d), isLeap: false };
}

function calculateZiWeiChart(params) {
  const { yearStemIdx, yearBranchIdx, month, day, hourBranchIdx, gender, gengMode } = params;
  const posMing = ((2 + (month - 1) - hourBranchIdx) % 12 + 12) % 12;
  const posShen = (2 + (month - 1) + hourBranchIdx) % 12;
  const stemYin = ((yearStemIdx % 5) * 2 + 2) % 10;
  const palaceStems = [];
  for (let b = 0; b < 12; b++) {
    const step = (b - 2 + 12) % 12;
    palaceStems[b] = (stemYin + step) % 10;
  }
  const mingStemIdx = palaceStems[posMing];
  const mingKey = STEMS[mingStemIdx] + BRANCHES[posMing];
  const bureauNum = NAYIN_BUREAU[mingKey] || 2;
  const bureauName = BUREAU_NAMES[bureauNum];

  let remainder = day % bureauNum;
  let x = remainder === 0 ? 0 : bureauNum - remainder;
  let q = (day + x) / bureauNum;
  let baseZiWei = 2 + (q - 1);
  let posZiWei = (x % 2 === 0) ? (baseZiWei + x) : (baseZiWei - x);
  posZiWei = ((posZiWei % 12) + 12) % 12;
  const posTianFu = ((4 - posZiWei) % 12 + 12) % 12;

  const palaces = Array.from({ length: 12 }, (_, b) => {
    const palaceOffset = (posMing - b + 12) % 12;
    return {
      branchIndex: b,
      branch: BRANCHES[b],
      stem: STEMS[palaceStems[b]],
      name: PALACE_NAMES[palaceOffset],
      isBody: b === posShen,
      majorStars: [],
      minorStars: [],
      shaStars: [],
      decadalRange: "",
      yearlyAges: []
    };
  });

  const ziweiGroup = [
    { name: "紫微", offset: 0 }, { name: "天機", offset: -1 },
    { name: "太陽", offset: -3 }, { name: "武曲", offset: -4 },
    { name: "天同", offset: -5 }, { name: "廉貞", offset: -8 }
  ];
  ziweiGroup.forEach(star => {
    const p = ((posZiWei + star.offset) % 12 + 12) % 12;
    palaces[p].majorStars.push(star.name);
  });

  const tianfuGroup = [
    { name: "天府", offset: 0 }, { name: "太陰", offset: 1 },
    { name: "貪狼", offset: 2 }, { name: "巨門", offset: 3 },
    { name: "天相", offset: 4 }, { name: "天梁", offset: 5 },
    { name: "七殺", offset: 6 }, { name: "破軍", offset: 10 }
  ];
  tianfuGroup.forEach(star => {
    const p = (posTianFu + star.offset) % 12;
    palaces[p].majorStars.push(star.name);
  });

  const posZuoFu = (4 + (month - 1)) % 12;
  const posYouBi = ((10 - (month - 1)) % 12 + 12) % 12;
  palaces[posZuoFu].minorStars.push("左輔");
  palaces[posYouBi].minorStars.push("右弼");

  const posWenChang = ((10 - hourBranchIdx) % 12 + 12) % 12;
  const posWenQu = (4 + hourBranchIdx) % 12;
  palaces[posWenChang].minorStars.push("文昌");
  palaces[posWenQu].minorStars.push("文曲");

  const kuiMap = [1, 0, 11, 11, 1, 0, 1, 6, 3, 3];
  const yueMap = [7, 8, 9, 9, 7, 8, 7, 2, 5, 5];
  palaces[kuiMap[yearStemIdx]].minorStars.push("天魁");
  palaces[yueMap[yearStemIdx]].minorStars.push("天鉞");

  const luCunMap = [2, 3, 5, 6, 5, 6, 8, 9, 11, 0];
  const posLuCun = luCunMap[yearStemIdx];
  palaces[posLuCun].minorStars.push("祿存");
  palaces[(posLuCun + 1) % 12].shaStars.push("擎羊");
  palaces[((posLuCun - 1) % 12 + 12) % 12].shaStars.push("陀羅");

  const posDiKong = ((11 - hourBranchIdx) % 12 + 12) % 12;
  const posDiJie = (11 + hourBranchIdx) % 12;
  palaces[posDiKong].shaStars.push("地空");
  palaces[posDiJie].shaStars.push("地劫");

  let huoBase = 1, lingBase = 3;
  if ([8, 0, 4].includes(yearBranchIdx)) { huoBase = 2; lingBase = 10; }
  else if ([5, 9, 1].includes(yearBranchIdx)) { huoBase = 3; lingBase = 10; }
  else if ([11, 3, 7].includes(yearBranchIdx)) { huoBase = 9; lingBase = 10; }
  palaces[(huoBase + hourBranchIdx) % 12].shaStars.push("火星");
  palaces[(lingBase + hourBranchIdx) % 12].shaStars.push("鈴星");

  let posTianMa = 8;
  if ([8, 0, 4].includes(yearBranchIdx)) posTianMa = 2;
  else if ([5, 9, 1].includes(yearBranchIdx)) posTianMa = 11;
  else if ([11, 3, 7].includes(yearBranchIdx)) posTianMa = 5;
  palaces[posTianMa].minorStars.push("天馬");

  const posHongLuan = ((3 - yearBranchIdx) % 12 + 12) % 12;
  const posTianXi = (posHongLuan + 6) % 12;
  palaces[posHongLuan].minorStars.push("紅鸞");
  palaces[posTianXi].minorStars.push("天喜");

  const sihuaTables = [
    { "廉貞": "祿", "破軍": "權", "武曲": "科", "太陽": "忌" },
    { "天機": "祿", "天梁": "權", "紫微": "科", "太陰": "忌" },
    { "天同": "祿", "天機": "權", "文昌": "科", "廉貞": "忌" },
    { "太陰": "祿", "天同": "權", "天機": "科", "巨門": "忌" },
    { "貪狼": "祿", "太陰": "權", "右弼": "科", "天機": "忌" },
    { "武曲": "祿", "貪狼": "權", "天梁": "科", "文曲": "忌" },
    gengMode === "tong_ji" 
      ? { "太陽": "祿", "武曲": "權", "天府": "科", "天同": "忌" } 
      : { "太陽": "祿", "武曲": "權", "太陰": "科", "天同": "忌" },
    { "巨門": "祿", "太陽": "權", "文曲": "科", "文昌": "忌" },
    { "天梁": "祿", "紫微": "權", "左輔": "科", "武曲": "忌" },
    { "破軍": "祿", "巨門": "權", "太陰": "科", "貪狼": "忌" }
  ];
  const sihua = sihuaTables[yearStemIdx];

  const isYangYear = yearStemIdx % 2 === 0;
  const isClockwiseLimit = (gender === "M" && isYangYear) || (gender === "F" && !isYangYear);

  for (let k = 0; k < 12; k++) {
    const targetBranch = isClockwiseLimit ? (posMing + k) % 12 : ((posMing - k) % 12 + 12) % 12;
    const startAge = bureauNum + k * 10;
    palaces[targetBranch].decadalRange = `${startAge}-${startAge + 9}`;
  }

  let xiaoXianStart = 4;
  if ([8, 0, 4].includes(yearBranchIdx)) xiaoXianStart = 10;
  else if ([5, 9, 1].includes(yearBranchIdx)) xiaoXianStart = 7;
  else if ([11, 3, 7].includes(yearBranchIdx)) xiaoXianStart = 1;

  const isXiaoXianClockwise = (gender === "M");
  for (let age = 1; age <= 108; age++) {
    const offset = (age - 1) % 12;
    const branch = isXiaoXianClockwise ? (xiaoXianStart + offset) % 12 : ((xiaoXianStart - offset) % 12 + 12) % 12;
    palaces[branch].yearlyAges.push(age);
  }

  const lifeLords = ["貪狼", "巨門", "祿存", "文曲", "廉貞", "武曲", "破軍", "武曲", "廉貞", "文曲", "祿存", "巨門"];
  const bodyLords = ["火星", "天相", "天梁", "天同", "文昌", "天機", "火星", "天相", "天梁", "天同", "文昌", "天機"];

  return {
    meta: {
      gender: gender === "M" ? (isYangYear ? "陽男" : "陰男") : (isYangYear ? "陽女" : "陰女"),
      bureau: bureauName,
      bureauNum: bureauNum,
      isClockwiseLimit: isClockwiseLimit,
      lifeLord: lifeLords[posMing],
      bodyLord: bodyLords[yearBranchIdx],
      sihua: sihua,
      yearStem: STEMS[yearStemIdx],
      yearBranch: BRANCHES[yearBranchIdx],
      month: month,
      day: day,
      hourBranch: BRANCHES[hourBranchIdx]
    },
    palaces: palaces,
    posMing: posMing,
    posShen: posShen
  };
}

  const grid = document.getElementById("chartGrid");

  document.getElementById("yearPillar").textContent = `${chart.meta.yearStem}${chart.meta.yearBranch}`;
  document.getElementById("monthPillar").textContent = `農曆 ${chart.meta.month} 月`;
  document.getElementById("dayPillar").textContent = `初 ${chart.meta.day} 日`;
  document.getElementById("hourPillar").textContent = `${chart.meta.hourBranch} 時`;

  document.getElementById("genderMeta").textContent = chart.meta.gender;
  document.getElementById("bureauMeta").textContent = chart.meta.bureau;
  document.getElementById("lifeLordMeta").textContent = chart.meta.lifeLord;
  document.getElementById("bodyLordMeta").textContent = chart.meta.bodyLord;

  chart.palaces.forEach(p => {
    const pos = GRID_POSITIONS[p.branchIndex];
    const card = document.createElement("div");
    card.className = "palace-card";
    card.style.gridColumn = pos.col;
    card.style.gridRow = pos.row;
    card.id = `palace-${p.branchIndex}`;
	card.onclick = () => inspectPalace(p.branchIndex, true);

    const starsDiv = document.createElement("div");
    starsDiv.className = "stars-container";

    p.majorStars.forEach(starName => {
      const bLevel = BRIGHTNESS_MAP[starName] ? BRIGHTNESS_MAP[starName][p.branchIndex] : "";
      const sh = chart.meta.sihua[starName];
      let sihuaHtml = "";
      if (sh === "祿") sihuaHtml = `<span class="sihua-tag sihua-lu">祿</span>`;
      if (sh === "權") sihuaHtml = `<span class="sihua-tag sihua-quan">權</span>`;
      if (sh === "科") sihuaHtml = `<span class="sihua-tag sihua-ke">科</span>`;
      if (sh === "忌") sihuaHtml = `<span class="sihua-tag sihua-ji">忌</span>`;

      starsDiv.innerHTML += `
        <span class="star-badge star-major">
          ${starName}<span class="star-brightness">${bLevel}</span>${sihuaHtml}
        </span>
      `;
    });

    p.minorStars.forEach(starName => {
      const sh = chart.meta.sihua[starName];
      let sihuaHtml = "";
      if (sh === "科") sihuaHtml = `<span class="sihua-tag sihua-ke">科</span>`;
      starsDiv.innerHTML += `<span class="star-badge star-minor-good">${starName}${sihuaHtml}</span>`;
    });

    p.shaStars.forEach(starName => {
      starsDiv.innerHTML += `<span class="star-badge star-minor-bad">${starName}</span>`;
    });

    const footerDiv = document.createElement("div");
    footerDiv.className = "palace-footer";

    const xiaoXianHtml = p.yearlyAges.length > 0
      ? p.yearlyAges.map((age, idx) => `<span style="white-space:nowrap;">${age}${idx < p.yearlyAges.length - 1 ? ',' : ''}</span>`).join("<wbr>")
      : "-";

    const limitsDiv = document.createElement("div");
    limitsDiv.className = "limits-info";
    limitsDiv.innerHTML = `
      <div>十年大運 ${p.decadalRange}</div>
      <div style="font-size:0.7rem; opacity:0.85; line-height:1.2; margin-top:2px; word-break:normal;">小限 ${xiaoXianHtml}</div>
    `;

    const nameGroup = document.createElement("div");
    nameGroup.className = "palace-name-group";
    nameGroup.innerHTML = `
      <div class="palace-name">
        ${p.name}${p.isBody ? '<span class="palace-body-mark">(身)</span>' : ''}
      </div>
      <div class="palace-stem-branch">${p.stem}${p.branch}</div>
    `;

    footerDiv.appendChild(limitsDiv);
    footerDiv.appendChild(nameGroup);
    card.appendChild(starsDiv);
    card.appendChild(footerDiv);
    grid.appendChild(card);
  });

  // 先縮放命盤、再定位命宮
  autoScaleChart();
  inspectPalace(chart.posMing);
  
}

function inspectPalace(targetBranchIdx, isUserClick = false) {
  if (!currentChartData) return;
  document.querySelectorAll(".palace-card").forEach(c => {
    c.classList.remove("active-selected", "highlight-opposite", "highlight-trine");
  });

  const oppositeIdx = (targetBranchIdx + 6) % 12;
  const trine1Idx = (targetBranchIdx + 4) % 12;
  const trine2Idx = (targetBranchIdx + 8) % 12;

  document.getElementById(`palace-${targetBranchIdx}`).classList.add("active-selected");
  document.getElementById(`palace-${oppositeIdx}`).classList.add("highlight-opposite");
  document.getElementById(`palace-${trine1Idx}`).classList.add("highlight-trine");
  document.getElementById(`palace-${trine2Idx}`).classList.add("highlight-trine");

  const pCurrent = currentChartData.palaces[targetBranchIdx];
  const pOpposite = currentChartData.palaces[oppositeIdx];
  const pTrine1 = currentChartData.palaces[trine1Idx];
  const pTrine2 = currentChartData.palaces[trine2Idx];

  function formatStars(p) {
    const list = [...p.majorStars, ...p.minorStars, ...p.shaStars];
    return list.length > 0 ? list.join("、") : "無主要曜星";
  }

  const inspector = document.getElementById("sanfangInspector");
  inspector.innerHTML = `
    <div style="font-weight:bold; color:var(--accent-brown); margin-bottom:2px;">
      【${pCurrent.name} (${pCurrent.stem}${pCurrent.branch}) 三方四正】
    </div>
    <div><span>本宮：</span>${formatStars(pCurrent)}</div>
    <div><span style="color:var(--accent-blue);">對宮 (${pOpposite.name})：</span>${formatStars(pOpposite)}</div>
    <div><span style="color:var(--accent-terracotta);">三合一 (${pTrine1.name})：</span>${formatStars(pTrine1)}</div>
    <div><span style="color:var(--accent-terracotta);">三合二 (${pTrine2.name})：</span>${formatStars(pTrine2)}</div>
  `;

  // 點擊宮位（或初始排盤預設選中命宮）時，同步更新動態標籤與下方 AI 解析內容
  renderPalaceAnalysis(pCurrent.name);
  
  // 僅在「使用者手動點擊」且為「手機／平板尺寸（寬度 <= 768px）」時平滑捲動（滑動時間延長 +0.5 秒）
  if (isUserClick && window.innerWidth <= 768) {
    const aiSectionEl = document.querySelector(".ai-section");
    if (aiSectionEl) {
      smoothScrollToElement(aiSectionEl, 12, 900);
    }
  }
}

function generateChart(isManual = false) {
  const mode = document.getElementById("calendarMode").value;
  const hourBranchIdx = parseInt(document.getElementById("hourBranch").value, 10);
  const gender = document.getElementById("gender").value;
  const gengMode = "tong_ji";

  let yearStemIdx, yearBranchIdx, month, day;

  if (mode === "solar") {
    const sDateVal = document.getElementById("solarDate").value;
    if (!sDateVal) return;
    const sDate = new Date(sDateVal);
    const lunar = solarToLunar(sDate);
    month = lunar.month;
    day = lunar.day;
    const offset = lunar.year - 1984;
    yearStemIdx = ((offset % 10) + 10) % 10;
    yearBranchIdx = ((offset % 12) + 12) % 12;
  } else {
    const lYear = parseInt(document.getElementById("lunarYear").value, 10);
    month = parseInt(document.getElementById("lunarMonth").value, 10);
    day = parseInt(document.getElementById("lunarDay").value, 10);
    const offset = lYear - 1984;
    yearStemIdx = ((offset % 10) + 10) % 10;
    yearBranchIdx = ((offset % 12) + 12) % 12;
  }

  const chart = calculateZiWeiChart({ yearStemIdx, yearBranchIdx, month, day, hourBranchIdx, gender, gengMode });
  renderChart(chart); // 內部會呼叫 inspectPalace(chart.posMing)，預設顯示「命宮&十年大運」
  
  if (isManual) {
    const rawName = document.getElementById("userName") ? document.getElementById("userName").value.trim() : "";
    const displayName = rawName ? rawName : "朋友";
    
    const noticeEl = document.getElementById("chartReadyNotice");
    if (noticeEl) {
      noticeEl.innerHTML = `✨ 親愛的 <span class="highlight-name">${displayName}</span>，您的專屬命盤已排定完成！點選命盤中任一宮位即可切換下方專屬解析，建議可先<strong>截圖儲存</strong>命盤喔！📸`;
      noticeEl.style.display = "block";
    }
    logChartRecord(chart, mode);
  }
}

function exportJSON() {
  if (!currentChartData) return;
  const blob = new Blob([JSON.stringify(currentChartData, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `ziwei_chart_${currentChartData.meta.yearStem}${currentChartData.meta.yearBranch}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function parseMarkdown(md) {
  if (!md) return "";

  let text = md
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>');

  const lines = text.split('\n');
  let html = [];

  let inOl = false;
  let inSubUl = false;
  let inUl = false;

  function closeAllLists() {
    if (inSubUl) {
      html.push('</ul>');
      inSubUl = false;
    }
    if (inOl) {
      html.push('</li>');
      html.push('</ol>');
      inOl = false;
    }
    if (inUl) {
      html.push('</ul>');
      inUl = false;
    }
  }

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trimEnd();
    const trimmed = line.trim();

    if (!trimmed) {
      continue;
    }

    if (/^(\-{3,}|\*{3,}|_{3,})$/.test(trimmed)) {
      closeAllLists();
      html.push('<hr class="ai-divider" />');
      continue;
    }

    if (/^####\s+(.*)/.test(trimmed)) {
      closeAllLists();
      html.push(`<h4>${trimmed.replace(/^####\s+/, '')}</h4>`);
      continue;
    }

    if (/^###\s+(.*)/.test(trimmed)) {
      closeAllLists();
      html.push(`<h3>${trimmed.replace(/^###\s+/, '')}</h3>`);
      continue;
    }

    if (/^##?\s+(.*)/.test(trimmed)) {
      closeAllLists();
      html.push(`<h3>${trimmed.replace(/^##?\s+/, '')}</h3>`);
      continue;
    }

    if (/^>\s?(.*)/.test(trimmed)) {
      closeAllLists();
      html.push(`<blockquote>${trimmed.replace(/^>\s?/, '')}</blockquote>`);
      continue;
    }

    const olMatch = line.match(/^(\s*)\d+\.\s+(.*)/);
    if (olMatch) {
      const content = olMatch[2];
      if (inUl) {
        html.push('</ul>');
        inUl = false;
      }
      if (inSubUl) {
        html.push('</ul>');
        inSubUl = false;
      }
      if (inOl) {
        html.push('</li>');
        html.push(`<li>${content}`);
      } else {
        html.push('<ol>');
        html.push(`<li>${content}`);
        inOl = true;
      }
      continue;
    }

    const ulMatch = line.match(/^(\s*)[-*•]\s+(.*)/);
    if (ulMatch) {
      const indent = ulMatch[1].length;
      const content = ulMatch[2];

      if (inOl) {
        if (!inSubUl) {
          html.push('<ul>');
          inSubUl = true;
        }
        html.push(`<li class="ai-sub-item">${content}</li>`);
      } else {
        if (!inUl) {
          html.push('<ul>');
          inUl = true;
        }
        const subClass = indent >= 2 ? ' class="ai-sub-item"' : '';
        html.push(`<li${subClass}>${content}</li>`);
      }
      continue;
    }

    closeAllLists();
    html.push(`<p>${trimmed}</p>`);
  }

  closeAllLists();
  return html.join('\n');
}

/**
 * 通用宮位輔煞星與生年四化審查輔助函式
 */
function analyzePalaceMinorShaSihua(chart, palace, actualStar) {
  const minors = palace.minorStars;
  const shas = palace.shaStars;
  let effects = [];

  if (minors.includes("左輔") || minors.includes("右弼")) {
    effects.push("會合 **左輔 / 右弼**：具備多方協同與貴人幫襯之優勢，遇到挑戰時易得平輩、夥伴或團隊的實質支援。");
  }
  if (minors.includes("文昌") || minors.includes("文曲")) {
    effects.push("會合 **文昌 / 文曲**：增添知性美感、專業文書契約運與高情商溝通力，利於透過知識與條理化解難題。");
  }
  if (minors.includes("天魁") || minors.includes("天鉞")) {
    effects.push("會合 **天魁 / 天鉞**：自帶體制貴人與長輩提攜機緣，在關鍵轉折點常有良師益友或政策紅利相助。");
  }
  if (minors.includes("祿存")) {
    effects.push("坐守 **祿存吉星**：賦予該領域極佳的資源穩定度與防守底氣，厚實穩健、能守住實質成果。");
  }
  if (minors.includes("天馬")) {
    effects.push("會合 **天馬動星**：帶有奔波躍動、跨界流轉或遠方拓展之象，越保持動態調整與向外連結，機遇越豐沛。");
  }
  if (minors.includes("紅鸞") || minors.includes("天喜")) {
    effects.push("會合 **紅鸞 / 天喜**：增添討喜人緣、喜慶機緣與親和魅力，在人際互動中極易博得他人好感。");
  }

  if (shas.includes("擎羊")) {
    effects.push("坐守 **擎羊煞星**：帶來強烈的開創破局魄力，但亦伴隨直接剛烈的摩擦張力；宜以柔克剛，避免言語或決策過衝。");
  }
  if (shas.includes("陀羅")) {
    effects.push("坐守 **陀羅煞星**：展現深沉耐磨的韌性，但偶有進度膠著、反覆糾結或隱性拖延之象；宜主動設定停損與推進節點。");
  }
  if (shas.includes("火星") || shas.includes("鈴星")) {
    effects.push("會合 **火星 / 鈴星**：具備瞬間爆發力與敏銳反應，但也容易出現情緒急躁或突發波動；需修煉定力、謀定而後動。");
  }
  if (shas.includes("地空") || shas.includes("地劫")) {
    effects.push("會合 **地空 / 地劫**：打破傳統既定框架，賦予跳脫常規的靈感與哲學超脫感；惟在實質財務或資源上需防範預期外的耗散。");
  }

  const effectText = effects.length > 0
    ? effects.map(e => `  - ${e}`).join("\n")
    : `  - ${palace.name}無特殊極端輔煞擾動，能量場平順穩定，全憑主星特質穩健發揮。`;

  let sihuaNote = "";
  const sh = chart.meta.sihua[actualStar];
  if (sh === "祿") {
    sihuaNote = `✦ **生年化祿引動（${actualStar}化祿）**：此宮位是你命盤中的「天然福報與資源順風區」，緣分深厚、機遇充沛，順勢投入即可獲得豐碩回饋。`;
  } else if (sh === "權") {
    sihuaNote = `✦ **生年化權引動（${actualStar}化權）**：此宮位展現強烈的「主控意識與升級企圖心」，你在此領域不甘被動，適合主動掌舵、建立規則。`;
  } else if (sh === "科") {
    sihuaNote = `✦ **生年化科引動（${actualStar}化科）**：此宮位帶有「清譽口碑、理性貴人與逢凶化吉」之氣場，講究體面與斯文合理的解決之道。`;
  } else if (sh === "忌") {
    sihuaNote = `✦ **生年化忌引動（${actualStar}化忌）**：此宮位是你今生最在乎、投入最多心力也最易反覆操心的「核心修煉場」；正視課題、放下過度執著，反而能淬煉出最深厚的底氣。`;
  }

  return { effectText, sihuaNote };
}

function streamTextToOutput(container, markdownText) {
  container.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "ai-markdown";
  container.appendChild(wrap);
  const cursor = document.createElement("span");
  cursor.className = "cursor-blink";
  container.appendChild(cursor);
  wrap.innerHTML = parseMarkdown(markdownText);
  cursor.remove();
}

let currentScrollAnimId = null;

// 自訂平滑捲動函式（預設 900ms，較原生約 400ms 捲動增加 +0.5 秒緩衝時間）
function smoothScrollToElement(targetEl, offsetTop = 12, duration = 900) {
  if (!targetEl) return;
  if (currentScrollAnimId) {
    cancelAnimationFrame(currentScrollAnimId);
    currentScrollAnimId = null;
  }

  const startY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
  const rect = targetEl.getBoundingClientRect();
  const maxScrollY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  const targetY = Math.min(maxScrollY, Math.max(0, startY + rect.top - offsetTop));
  const distance = targetY - startY;

  if (Math.abs(distance) < 2) return;

  const startTime = performance.now();

  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function step(now) {
    const elapsed = now - startTime;
    const progress = Math.min(1, elapsed / duration);
    const eased = easeInOutCubic(progress);
    window.scrollTo(0, startY + distance * eased);

    if (progress < 1) {
      currentScrollAnimId = requestAnimationFrame(step);
    } else {
      currentScrollAnimId = null;
    }
  }

  currentScrollAnimId = requestAnimationFrame(step);
}

let toastTimer = null;
function showToast(message) {
  const toastEl = document.getElementById("copyToast");
  if (!toastEl) return;
  toastEl.textContent = message;
  toastEl.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toastEl.classList.remove("show");
  }, 2400);
}

function copyAnalysisText() {
  const box = document.getElementById("aiOutputBox");
  const text = box ? box.innerText : "";
  if (!text || text.includes("排盤後將自動")) {
    showToast("尚未生成解析報告！");
    return;
  }
  const label = currentSelectedPalaceName === "命宮" ? "命宮&十年大運" : `${currentSelectedPalaceName}宮`;
  const successMsg = `【${label}】命理報告已成功複製至剪貼簿！`;

  function fallbackCopy(str) {
    const ta = document.createElement("textarea");
    ta.value = str;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand("copy");
      showToast(successMsg);
    } catch (e) {
      showToast("複製失敗，請手動選取複製");
    }
    document.body.removeChild(ta);
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showToast(successMsg);
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  document.getElementById("solarDate").value = `${y}-${m}-${d}`;
  document.getElementById("hourBranch").value = "0";

  const lunarNow = solarToLunar(now);
  document.getElementById("lunarYear").value = lunarNow.year;
  document.getElementById("lunarMonth").value = lunarNow.month;
  document.getElementById("lunarDay").value = lunarNow.day;
}

window.onload = () => {
  initDefaultDateTime();
  
  new Rolldate({
    el: '#solarDate',
    format: 'YYYY-MM-DD',
    beginYear: 1900,
    endYear: 2050,
    lang: { 
      title: '選擇西曆出生日期',
      cancel: '取消',
      confirm: '確定',
      year: '年',
      month: '月',
      day: '日'
    },
    confirm: function(date) {}
  });
  
  generateChart(); // 自動排盤並預設顯示「命宮&十年大運」
};
</script>
</body>
